<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>HEARTCODE — танысу платформасы</title>
  <style>
    :root{color-scheme:light;--ink:#2b2441;--purple:#6b47ae;--muted:#716780}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    #course{display:block;width:100%;height:100%;height:100dvh;border:0;background:#fff}
    .preview-modal{position:fixed;inset:0;z-index:2147483647;align-items:center;justify-content:center;padding:20px;background:rgba(27,21,39,.22);backdrop-filter:blur(2px);display:none}
    .preview-modal.is-open{display:flex}
    .preview-dialog{width:min(100%,365px);border:1px solid #ece4f6;border-radius:20px;padding:24px 22px 20px;background:#fff;box-shadow:0 18px 54px rgba(44,32,74,.16);text-align:center}
    .preview-lockicon{width:50px;height:50px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#f5f0fc;color:#7151a0;font-size:24px}
    .preview-dialog h2{margin:0 0 9px;font-size:19px;line-height:1.3;font-weight:750;letter-spacing:-.4px}
    .preview-dialog p{margin:0 0 18px;font-size:13px;line-height:1.7;color:var(--muted)}
    .preview-button{width:100%;min-height:43px;background:var(--purple);color:#fff;border:0;border-radius:12px;cursor:pointer;font-size:13px;font-weight:700}
    .preview-button:hover{background:#5c3998}
    @media(max-width:560px){.preview-modal{align-items:flex-end;padding:0 12px 14px}.preview-dialog{width:100%;border-radius:19px;padding:21px 19px 18px}.preview-dialog h2{font-size:18px}}
    @media(prefers-reduced-motion:reduce){.preview-modal{backdrop-filter:none}}
  </style>
</head>
<body>
  <!-- Same questionnaire and course UI as the main HEARTCODE platform. -->
  <iframe id="course" title="HEARTCODE оқу платформасы" src="../index.html?heartcode_preview=1#home" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="previewLock" class="preview-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="previewLockTitle" aria-describedby="previewLockText">
    <div class="preview-dialog">
      <div class="preview-lockicon" aria-hidden="true">🔒</div>
      <h2 id="previewLockTitle">Толық қолжетімділік қажет</h2>
      <p id="previewLockText">Бұл материал толық курсқа төлем жасағаннан кейін ашылады.</p>
      <button class="preview-button" id="previewOkay" type="button">Түсінікті</button>
    </div>
  </div>
  <script src="preview.js"></script>
</body>
</html>
